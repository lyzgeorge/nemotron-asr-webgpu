# Static site — no build step. Publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Always revalidate app files so deploys are never served stale from browser cache.
# (Model weights are fetched cross-origin from Hugging Face, so there's no perf cost here.)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
